name: Deploy to Staging

on:
  push:
    branches: [main, master, staging]
  workflow_dispatch:  # manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
  SERVER_USER: ${{ secrets.DEPLOY_USER }}
  APP_DIR: /opt/desa-uew

jobs:
  # ── Build & Push Docker Images ───────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      # ── API Image ──────────────────────────────────────────────────
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./DESA-UEW-API
          file: ./DESA-UEW-API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # ── UI Image ───────────────────────────────────────────────────
      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./DESA-UEW-UI
          file: ./DESA-UEW-UI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Server ─────────────────────────────────────────────
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="{{ env.APP_DIR }}"
            SHA="{{ github.sha }}"
            IMG="ghcr.io/{{ github.repository }}"

            echo "==> Pulling latest .env if exists..."
            cd "$APP_DIR"

            # Backup .env before overwrite
            if [ -f .env ]; then
              echo "==> Backing up .env..."
              cp .env ".env.backup.$(date +%Y%m%d-%H%M%S)"
            fi

            echo "==> Pulling latest code..."
            git pull origin main || git pull origin master || true

            echo "==> Stopping old containers..."
            docker compose down --remove-orphans 2>/dev/null || true

            echo "==> Building & pulling images..."
            docker compose build --no-cache app nginx 2>&1 | tail -20

            echo "==> Starting services..."
            docker compose up -d

            echo "==> Waiting for API to be healthy..."
            for i in $(seq 1 30); do
              if docker compose ps app | grep -q "healthy"; then
                echo "==> API is healthy!"
                break
              fi
              echo "  Waiting... ($i/30)"
              sleep 5
            done

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy complete!"
            docker compose ps

      - name: Notify Success
        if: success()
        run: |
          echo "Deployment successful: ${{ github.sha }}"
          echo "SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "Deployment failed: ${{ github.sha }}"
          echo "Check GitHub Actions logs for details."
