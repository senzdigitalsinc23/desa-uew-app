name: Release (Tagged Deploy)

on:
  push:
    tags:
      - 'v*'  # matches v1.0.0, v2.1.3, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /opt/desa-uew

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=release

      # Build API
      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./DESA-UEW-API
          file: ./DESA-UEW-API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:release
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build UI
      - name: Build & push UI
        uses: docker/build-push-action@v5
        with:
          context: ./DESA-UEW-UI
          file: ./DESA-UEW-UI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:release
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd "{{ env.APP_DIR }}"
            TAG="${{ steps.meta.outputs.version }}"
            IMG="ghcr.io/${{ github.repository }}"

            echo "==> Deploying release $TAG"
            docker compose down
            docker compose build --pull app nginx
            docker compose up -d

            for i in $(seq 1 30); do
              if docker compose ps api | grep -q healthy; then
                echo "==> Healthy!"
                break
              fi
              sleep 5
            done

            docker compose ps
