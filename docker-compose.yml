services:
  # ── PHP-FPM API ──────────────────────────────────────────────────────
  app:
    build:
      context: ./DESA-UEW-API
      dockerfile: Dockerfile
    container_name: desa-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-desa_db}
      DB_USER: ${DB_USER:-desa_user}
      DB_PASS: ${DB_PASS:-desa_pass}
      DB_CHARSET: utf8mb4
      JWT_SECRET: ${JWT_SECRET:-}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_URL: ${S3_URL:-}
      S3_ACL: ${S3_ACL:-public-read}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      STORAGE_PATH: /var/www/storage/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-jpg,jpeg,png,gif,webp,svg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,mp4,mp3}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CACHE_DRIVER: file
      CACHE_TTL: 3600
      SESSION_LIFETIME: 120
      LOG_LEVEL: info
    volumes:
      - api_storage:/var/www/storage
    networks:
      - desa-net
    healthcheck:
      test: ["CMD", "php", "-r", "try{new PDO('mysql:host=db',getenv('DB_USER'),getenv('DB_PASS'));exit(0);}catch(Exception\$e){exit(1);}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nginx (serves React + proxies /api → PHP-FPM) ──────────────────
  nginx:
    build:
      context: ./DESA-UEW-UI
      dockerfile: Dockerfile
    container_name: desa-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - desa-net
    depends_on:
      app:
        condition: service_healthy

  # ── MySQL ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: desa-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-desa_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MYSQL_USER: ${DB_USER:-desa_user}
      MYSQL_PASSWORD: ${DB_PASS:-desa_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - desa-net
    command: --default-authentication-plugin=mysql_native_password --max_connections=200

networks:
  desa-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  api_storage:
    driver: local
