<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#162238" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="DESA SEEK - UEW Distance Learning Students Association Search Portal. Explore courses, past questions, fees, timetables, and centers." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <title>UEW DESA APP | DESA SEEK</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured Error:', e);
        var errDiv = document.getElementById('error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'error-overlay';
          errDiv.style = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:16px;z-index:99999;font-family:monospace;font-size:14px;border-bottom:2px solid #ef4444;white-space:pre-wrap;';
          document.body.appendChild(errDiv);
        }
        errDiv.innerText += 'Error: ' + (e.message || e.error) + '\nAt: ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
      });
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-uew-gold selection:text-uew-navy min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
