<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C52227"/>
      <stop offset="50%" stop-color="#A8181D"/>
      <stop offset="100%" stop-color="#6E0B10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#redGrad)" stroke-width="6" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="170" fill="#162238" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Academic Cap & Gown Silhouette -->
  <g transform="translate(100, 70) scale(1)">
    <!-- Robe silhouette in UEW Navy with Red stole -->
    <path d="M 100,160 Q 50,180 10,270 L 190,270 Q 150,180 100,160 Z" fill="#0E1726" stroke="#A8181D" stroke-width="2"/>
    
    <!-- Deeper Crimson Academic Stole / Collar -->
    <path d="M 70,270 L 100,175 L 130,270" fill="none" stroke="#A8181D" stroke-width="4"/>
    <polygon points="100,175 90,215 110,215" fill="#FFFFFF"/>
    
    <!-- Head / Neck -->
    <circle cx="100" cy="125" r="45" fill="#E2E8F0" opacity="0.9"/>
    <path d="M 65,120 Q 100,70 135,120 Z" fill="#162238"/>
    
    <!-- Mortarboard / Academic Cap in UEW Crimson & Gold -->
    <polygon points="100,45 175,75 100,105 25,75" fill="#A8181D"/>
    <polygon points="50,85 50,115 150,115 150,85" fill="#750E12"/>
    <path d="M 165,80 L 175,130" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <circle cx="175" cy="135" r="5" fill="#D4AF37"/>
  </g>
  
  <rect x="50" y="325" width="300" height="34" rx="17" fill="#162238" stroke="#A8181D" stroke-width="2"/>
  <text x="200" y="347" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FOUNDER / FIRST PRESIDENT</text>
</svg>
