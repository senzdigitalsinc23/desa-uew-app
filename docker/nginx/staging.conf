server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA routing ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API requests to API nginx ────────────────────────────
    location ~ ^/api/ {
        proxy_pass         http://api-nginx:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout  30s;
    }

    # ── PHP handler (for any direct .php access) ───────────────────
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
    }

    # ── Deny access to sensitive paths ─────────────────────────────
    location ~ ^/(\.env|\.git|composer\.(json|lock)|Database/|config/) {
        deny all;
        return 404;
    }

    # ── Static asset caching ───────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|pdf|mp4|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip compression ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
